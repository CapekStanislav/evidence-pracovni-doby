 */

// Apply the java-library plugin to add support for Java Library
apply plugin: 'java-library'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// In this section you declare where to find the dependencies of your project
repositories {
    // Use jcenter for resolving your dependencies.
    // You can declare any Maven/Ivy/file repository here.
    mavenCentral()
}

dependencies {
    api 'com.github.vandeseer:easytable:0.6.0'
    api 'org.apache.poi:poi-ooxml:4.0.1'
    api 'org.apache.poi:poi:4.0.1'
    api 'org.apache.logging.log4j:log4j-core:2.13.3'
    api 'org.apache.logging.log4j:log4j-api:2.13.3'
    api 'com.fasterxml.jackson.core:jackson-core:2.11.2'
    api 'com.fasterxml.jackson.core:jackson-databind:2.11.2'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.11.2'
    api 'org.springframework.boot:spring-boot-starter:2.3.4.RELEASE'

    implementation 'com.github.jiconfont:jiconfont-swing:1.0.1'
    implementation 'com.github.jiconfont:jiconfont-elusive:2.0.3'
    implementation 'org.jsoup:jsoup:1.12.1'

    // Use JUnit test framework
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.6.2'
}


test {
    useJUnitPlatform()
}
